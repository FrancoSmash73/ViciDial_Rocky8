LogFormat "%h %l %u %t \"%m %U [query redacted] %H\" %>s %b \"-\" \"%{User-Agent}i\"" combined_redacted

<VirtualHost *:80>
    ServerName campaignvoiceservices.com
    ServerAlias www.campaignvoiceservices.com callbakz.ddns.net
    Include /etc/httpd/vicidial-common.inc

    ErrorLog /var/log/httpd/vicidial_error.log
    # Credentials-in-URL redaction (2026-10-14): ViciDial/HulkPhone pass phone_pass / VD_pass / pp as GET params.
    SetEnvIfExpr "%{QUERY_STRING} =~ /(^|&)([A-Za-z_]*(pass|pw|secret)[A-Za-z_]*|pp)=/i || %{HTTP_REFERER} =~ /[?&]([A-Za-z_]*(pass|pw|secret)[A-Za-z_]*|pp)=/i" cred_in_url
    CustomLog /var/log/httpd/vicidial_access.log combined env=!cred_in_url
    CustomLog /var/log/httpd/vicidial_access.log combined_redacted env=cred_in_url
</VirtualHost>
