# ==============================================================================
# ViciDial Rocky 8 Installer — Version Configuration
# ==============================================================================
# Edit this file to change the versions the installer targets, instead of
# hunting through part1/part2/part4 for hardcoded strings.
#
# IMPORTANT: not every version below is actually pinned by the installer —
# see the notes at the bottom before assuming a value here changes behavior.
# ==============================================================================

# PHP version, selected via the Remi repository module stream
# (dnf module enable php:remi-${PHP_VERSION}). Remi's EL8 repo carries 8.3.
# Used by: vicidial_rocky10_part1_install.sh (PHP install step)
PHP_VERSION="8.3"

# Plain upstream Asterisk from downloads.asterisk.org, no ViciDial patches.
# 20.18.2 matches the production box (Oliver). ViciDial publishes no
# 20.x-vici tarball and no Asterisk-20 patch set.
# Used by: vicidial_rocky10_part2_install.sh (Asterisk build)
ASTERISK_VERSION="20.18.2"

# Branch of github.com/FrancoSmash73/dahdi-linux-3.4.0 that Part 2 clones.
# The shared repo is left untouched; Part 2 applies
# patches/dahdi-linux-el8-timer-compat.patch on top for Rocky 8's 4.18 kernel.
# Used by: vicidial_rocky10_part2_install.sh (DAHDI build)
DAHDI_LINUX_BRANCH="master"

# ------------------------------------------------------------------------------
# NOT independently configurable today — informational only:
#
# MariaDB — 10.11 from Rocky 8's AppStream module stream (`dnf module enable
#   mariadb:10.11`, Part 1). The stream exists only on Rocky 8.10+; the
#   default stream on Rocky 8 is 10.3, which is why Part 1 enables it.
#
# Perl — 5.26, Rocky 8's default system perl. Don't switch to the 5.30/5.32
#   module streams after install: that breaks every RPM-installed Perl module.
#   Site modules go to $Config{installsitelib} (/usr/local/share/perl5).
# ------------------------------------------------------------------------------
