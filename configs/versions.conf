# ==============================================================================
# ViciDial Rocky 10 Installer — Version Configuration
# ==============================================================================
# Edit this file to change the versions the installer targets, instead of
# hunting through part1/part2/part4 for hardcoded strings.
#
# IMPORTANT: not every version below is actually pinned by the installer —
# see the notes at the bottom before assuming a value here changes behavior.
# ==============================================================================

# PHP version, selected via the Remi repository module stream
# (dnf module enable php:remi-${PHP_VERSION})
# Used by: vicidial_rocky10_part1_install.sh (PHP install step)
PHP_VERSION="8.3"

# Asterisk-vici tarball version, downloaded from download.vicidial.com
# (asterisk-${ASTERISK_VICI_VERSION}.tar.gz)
# Used by: vicidial_rocky10_part2_install.sh (Asterisk build, primary source)
ASTERISK_VICI_VERSION="18.21.0-vici"

# Fallback plain-Asterisk version from asterisk.org, used only if the
# vici-patched tarball above is unavailable (manual ViciDial patches applied
# afterward). Used by: vicidial_rocky10_part2_install.sh (Asterisk build, fallback)
ASTERISK_PLAIN_VERSION="18.26.4"

# ------------------------------------------------------------------------------
# NOT independently configurable today — informational only:
#
# MariaDB — installed via `dnf install mariadb-server mariadb mariadb-devel`
#   from Rocky 10's native default module stream (currently ships 10.11).
#   The scripts do not pin a version; editing a value here would do nothing.
#   Actually pinning it would mean adding `dnf module enable mariadb:X.Y -y`
#   to part1 before install — a behavior change, not a refactor. Worth doing
#   only if a customer specifically needs a non-default MariaDB version.
#
# Perl — 5.40, whatever Rocky Linux 10 ships as system perl. Not selected by
#   this installer; upgrading it is an OS-level decision, not ours to make.
# ------------------------------------------------------------------------------
